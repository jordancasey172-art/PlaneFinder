services:
  - type: web
    name: planefinder
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: ADMIN_ACCESS_CODE
        value: Goldenticket
      - key: ADMIN_TOKEN
        value: Goldenticket
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
